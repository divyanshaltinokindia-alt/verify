<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate Verification</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1b2230; --muted: #5b6577;
    --line: #dde2ea; --accent: #1d4fa3; --ok: #127a46; --ok-bg: #e7f5ee;
    --bad: #a3261d; --bad-bg: #fbeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --card: #1a2029; --text: #e7ebf2; --muted: #9aa4b5;
      --line: #2c3440; --accent: #7fa8ff; --ok: #5fd39a; --ok-bg: #13291f;
      --bad: #ff8a80; --bad-bg: #2e1715;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 620px; margin: 0 auto; padding: 40px 16px 64px; }
  .issuer { color: var(--muted); font-size: 14px; letter-spacing: .02em; margin: 0 0 4px; }
  h1 { font-size: 26px; margin: 0 0 24px; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    text-transform: uppercase;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 12px 18px; font: inherit; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0d1420; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .status { display: inline-block; font-weight: 600; font-size: 14px; padding: 4px 10px; border-radius: 999px; margin-bottom: 16px; }
  .status.ok { color: var(--ok); background: var(--ok-bg); }
  .status.bad { color: var(--bad); background: var(--bad-bg); }
  .name { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  ul { margin: 4px 0 0; padding-left: 18px; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 24px; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    form { flex-direction: column; }
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 10px; }
  }
</style>
</head>
<body>
<main>
  <p class="issuer" id="issuer"></p>
  <h1>Certificate Verification</h1>

  <form id="form" autocomplete="off">
    <label for="id" style="position:absolute;left:-9999px">Credential ID</label>
    <input id="id" name="id" placeholder="Enter Credential ID, e.g. MIDAS-BMC-2026-0001" required>
    <button type="submit">Verify</button>
  </form>

  <section class="card" id="ok" hidden>
    <span class="status ok">&#10003; Valid certificate</span>
    <p class="name" id="r-name"></p>
    <p class="lead">has attended the <span id="r-type"></span></p>
    <dl>
      <dt>Course</dt><dd id="r-course"></dd>
      <dt>Dates</dt><dd id="r-dates"></dd>
      <dt>Topics</dt><dd><ul id="r-topics"></ul></dd>
      <dt>Issued by</dt><dd id="r-issuer"></dd>
      <dt>Credential ID</dt><dd id="r-id"></dd>
    </dl>
  </section>

  <section class="card" id="bad" hidden>
    <span class="status bad">&#10007; Not found</span>
    <p style="margin:0">No certificate matches <strong id="bad-id"></strong>. Check the ID as printed on the certificate and try again.</p>
  </section>

  <p class="hint">The Credential ID is printed on each certificate.</p>
</main>

<script src="records.js"></script>
<script>
(function () {
  var meta = window.CREDENTIAL_META || {};
  var data = window.CREDENTIALS || {};
  var $ = function (id) { return document.getElementById(id); };
  $("issuer").textContent = meta.issuer || "";

  function show(raw) {
    var id = (raw || "").trim().toUpperCase();
    $("ok").hidden = $("bad").hidden = true;
    if (!id) return;
    $("id").value = id;
    var rec = data[id];
    if (!rec) { $("bad-id").textContent = id; $("bad").hidden = false; return; }
    $("r-name").textContent = rec.name;
    $("r-type").textContent = meta.course_type;
    $("r-course").textContent = meta.course;
    $("r-dates").textContent = meta.dates_label;
    $("r-issuer").textContent = meta.issuer;
    $("r-id").textContent = id;
    var ul = $("r-topics"); ul.innerHTML = "";
    (meta.topics || []).forEach(function (t) {
      var li = document.createElement("li"); li.textContent = t; ul.appendChild(li);
    });
    $("ok").hidden = false;
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = $("id").value.trim().toUpperCase();
    try { history.replaceState(null, "", "?id=" + encodeURIComponent(id)); } catch (_) {}
    show(id);
  });

  show(new URLSearchParams(location.search).get("id"));
})();
</script>
</body>
</html>
